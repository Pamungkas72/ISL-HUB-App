<!DOCTYPE html>
<html lang="id">
<head>
  <script>(function(){var s=null;try{s=localStorage.getItem("islhub-sidebar")}catch(e){}if(s!=="buka")document.documentElement.classList.add("sb-lipat")})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0A3D66" />
<script src="js/tema.js"></script>
<script src="js/galat-otomatis.js"></script>
<title>ISL HUB — Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/tambahan.css" />
<link rel="stylesheet" href="css/tema-gelap.css" />
<!-- Portal foto pelabuhan 2,5D: gaya desktop (>= 761 px) dan gaya HP (<= 760 px) dipisah lewat media pada <link>. -->
<link rel="stylesheet" href="css/login-bersama.css" />
<link rel="stylesheet" href="css/login-portal.css" media="(min-width: 761px)" />
<link rel="stylesheet" href="css/login-mobile.css" media="(max-width: 760px)" />
<style>
</style>
</head>
<body>

<div class="login-screen">
  <!-- Desktop: latar foto pelabuhan 2,5D (WebGL, js/portal-parallax.js). Tab modul dan form login ada di panel kaca (.login-dock). -->
  <div class="portal" id="portal">
    <canvas class="portal-kanvas" id="portal-kanvas" aria-hidden="true"></canvas>
    <div class="portal-scrim" aria-hidden="true"></div>
    <header class="portal-atas"><div class="portal-merek">ISL <span>HUB</span></div></header>
    <div class="portal-judul">
      <p class="portal-kicker">Portal modul</p>
      <h1>Satu pintu untuk seluruh operasi logistik Anda</h1>
      <p class="portal-sub">Pilih modul, lalu masuk dengan akun Anda.</p>
    </div>
  </div>
  <div class="login-dock">
  <nav class="mob-modul" aria-label="Pilih modul">
    <button type="button" class="mob-chip is-pilih" data-modul="isl" data-nama="ISL HUB" data-aktif="1"><i style="background:#1d5fd6"></i>ISL HUB</button>
    <button type="button" class="mob-chip" data-modul="m2" data-nama="Modul 2" data-aktif="0"><i style="background:#e8601c"></i>Modul 2</button>
    <button type="button" class="mob-chip" data-modul="m3" data-nama="Modul 3" data-aktif="0"><i style="background:#2a9d3f"></i>Modul 3</button>
    <button type="button" class="mob-chip" data-modul="m4" data-nama="Modul 4" data-aktif="0"><i style="background:#d63a2e"></i>Modul 4</button>
    <button type="button" class="mob-chip" data-modul="m5" data-nama="Modul 5" data-aktif="0"><i style="background:#f5b81c"></i>Modul 5</button>
  </nav>
  <p class="mob-info" id="mob-info" role="status" aria-live="polite"></p>
  <div class="login-form-side">
    <div class="login-form-wrap">
      <div class="login-mark">ISL <span>HUB</span></div>
      <h2 id="login-judul">Masuk</h2>
      <p class="login-sub" id="login-sub">Gunakan akun yang sudah terdaftar. Belum punya? Daftar akun.</p>

      <div class="login-error hidden" id="login-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email, username, atau nomor telepon</label>
          <input type="text" id="email" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary" id="btn-submit">Masuk</button>
      </form>

      <form id="daftar-form" class="hidden" novalidate>
        <div class="field"><label for="df-nama">Nama lengkap</label><input type="text" id="df-nama" autocomplete="name" required /></div>
        <div class="field"><label for="df-email">Email</label><input type="email" id="df-email" autocomplete="username" required /></div>
        <div class="field"><label for="df-wa">Nomor WhatsApp</label><input type="tel" id="df-wa" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx" required /></div>
        <div class="field"><label for="df-pass">Kata sandi (min. 6 karakter)</label><input type="password" id="df-pass" autocomplete="new-password" required /></div>
        <button type="submit" class="btn-primary" id="df-submit">Daftar</button>
        <p class="login-hint">Akun baru aktif setelah disetujui master.</p>
      </form>
      <p class="login-hint"><a href="#" id="tog-daftar" style="color:inherit;text-decoration:underline">Belum punya akun? Daftar akun</a></p>
      <p class="login-hint"><a href="#" id="lupa-sandi" style="color:inherit;text-decoration:underline">Lupa kata sandi?</a></p>
      <p class="login-hint hidden" id="lupa-info" role="status"></p>
    </div>
  </div>
  </div>
</div>


<script type="module" src="js/login-portal.js"></script>
<script type="module" src="js/gulir-tetap.js"></script>
<script type="module" src="js/login.js"></script>
<script type="module" src="js/anti-salin.js"></script>
</body>
</html>
