<meta charset="UTF-8" />

<!-- Pustaka lokal (tidak bergantung CDN): Excel, PDF, tabel PDF, tangkapan halaman, dan Word -->
  <script>
  /* Pustaka ekspor (Excel, PDF, Word) dimuat setelah halaman siap dan sedang idle, bukan saat halaman dibuka. Urutannya dijaga. */
  window.addEventListener("load", function () {
    var daftar = ["vendor/xlsx.full.min.js", "vendor/jspdf.umd.min.js", "vendor/jspdf.plugin.autotable.min.js", "vendor/html2canvas.min.js", "vendor/docx.iife.js"];
    var mulai = function () { daftar.forEach(function (src) { var s = document.createElement("script"); s.src = src; s.async = false; document.body.appendChild(s); }); };
    if ("requestIdleCallback" in window) requestIdleCallback(mulai, { timeout: 1500 }); else setTimeout(mulai, 800);
  });
</script>
<script src="js/sk-parser.js"></script>
</head>
<body>

<div class="app-shell">
  <nav id="app-nav" class="app-nav"></nav>

  <div class="app-main">
    <div class="app-topbar">
      <h1>Memuat...</h1>
      <div class="app-topbar__user" id="user-email">Memuat...</div>
    </div>

    <!-- Kerangka kosong: modul Customer dan Quotation membuat area kerjanya sendiri di sini -->
    <div class="app-content mr hidden" id="mr-root"></div>

    <!-- Halaman yang dirute di dalam shell ini (lihat app-boot.js) -->
    <div class="app-content mr hidden" id="mr-kontainer"></div>
    <div class="app-content mr hidden" id="uj-root"></div>
    <div class="app-content mr hidden" id="st-root"><p class="mr-sub">Memuat…</p></div>
    <div class="app-content hidden" id="bd-root">
      <p style="color:var(--muted); font-size:14px; margin:0;">
        Kerangka dasar sudah aktif. Modul di bawah akan diisi bertahap sesuai urutan fase.
      </p>
      <div class="module-grid" id="module-grid"></div>
    </div>
  </div>
</div>

<div id="mr-layer" class="mr-layer"></div>
<div id="mr-toasts" class="mr-toasts" aria-live="polite"></div>

<script src="js/versi.js"></script>
<script src="js/ke-atas.js"></script>
<script type="module" src="js/gulir-tetap.js"></script>
<script type="module" src="js/app-boot.js"></script>
<script type="module" src="js/pintasan.js"></script>
<script type="module" src="js/anti-salin.js"></script>
<script type="module" src="js/keterangan.js"></script>
</body>
</html>
