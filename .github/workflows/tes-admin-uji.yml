# Tes akun ADMIN di produksi. MENULIS data uji (awalan "UJI") ke Firestore: hapus manual setelah dicek.
# Butuh secret UJI_EMAIL dan UJI_PASSWORD. Dijalankan manual saja (Actions > Tes admin (uji) > Run workflow).
name: Tes admin (uji)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Pasang Playwright dan Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/tes"
          cd "$RUNNER_TEMP/tes"
          npm init -y > /dev/null
          npm install playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Jalankan tes admin
        env:
          UJI_EMAIL: ${{ secrets.UJI_EMAIL }}
          UJI_PASSWORD: ${{ secrets.UJI_PASSWORD }}
          HASIL_DIR: ${{ runner.temp }}/hasil
          NODE_PATH: ${{ runner.temp }}/tes/node_modules
        run: node tests/e2e/admin-uji.js

      - name: Jalankan tes pilih banyak vendor dan lokasi
        if: always()
        env:
          UJI_EMAIL: ${{ secrets.UJI_EMAIL }}
          UJI_PASSWORD: ${{ secrets.UJI_PASSWORD }}
          HASIL_DIR: ${{ runner.temp }}/hasil
          NODE_PATH: ${{ runner.temp }}/tes/node_modules
        run: node tests/e2e/pilih-banyak-uji.js

      - name: Ambil screenshot UI (baca saja)
        if: always()
        env:
          UJI_EMAIL: ${{ secrets.UJI_EMAIL }}
          UJI_PASSWORD: ${{ secrets.UJI_PASSWORD }}
          HASIL_DIR: ${{ runner.temp }}/hasil
          NODE_PATH: ${{ runner.temp }}/tes/node_modules
        run: node tests/e2e/tangkapan-ui-uji.js

      - name: Ringkasan hasil
        if: always()
        run: |
          echo "### Hasil tes admin (uji)" >> "$GITHUB_STEP_SUMMARY"
          for f in ringkasan.json ringkasan-pilih.json ringkasan-ui.json; do
            if [ -f "$RUNNER_TEMP/hasil/$f" ]; then
              echo "**$f**" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$RUNNER_TEMP/hasil/$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$f tidak dihasilkan. Periksa log langkah sebelumnya." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: hasil-tes-admin
          path: ${{ runner.temp }}/hasil
          if-no-files-found: ignore
